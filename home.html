<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlantEye - Disease Recognition</title>
    <link rel="icon" href="../static/images/logo.svg" type="image/svg+xml">
    
    <link rel="stylesheet" href="../static/css/bootstrap.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- GLOBAL STYLES --- */
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            overflow-x: hidden;
        }

        /* --- BACKGROUND IMAGE SECTION --- */
        .hero-section {
            position: relative;
            width: 100%;
            min-height: 100vh;
            /* Replace the URL below with your actual background image path */
            background: url('../static/images/background.jpg') no-repeat center center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        /* Dark Overlay to make text pop */
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.7));
            z-index: 1;
        }

        /* --- NAVBAR STYLES --- */
        .navbar {
            position: absolute;
            top: 0;
            width: 100%;
            z-index: 10;
            padding: 15px 0;
            background: transparent; /* Transparent navbar */
        }
        
        .navbar-brand span {
            text-shadow: 0px 2px 4px rgba(0,0,0,0.2); /* Shadow for legibility on bg */
        }

        /* --- GLASSMORPHISM CARD (THE FORM) --- */
        .glass-card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.15); /* Translucent white */
            backdrop-filter: blur(15px); /* Blur effect */
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            color: white;
            text-align: center;
            margin-top: 60px;
        }

        .glass-card h1 {
            font-weight: 700;
            margin-bottom: 25px;
            font-size: 2rem;
        }

        /* --- CUSTOM FILE UPLOAD STYLING --- */
        .file-upload-wrapper {
            position: relative;
            width: 100%;
            height: 150px;
            border: 2px dashed rgba(255, 255, 255, 0.6);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
        }

        .file-upload-wrapper:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #fff;
        }

        .file-upload-wrapper i {
            font-size: 40px;
            margin-bottom: 10px;
            color: #fff;
        }

        .file-upload-wrapper p {
            font-size: 14px;
            color: #eee;
            margin: 0;
        }

        /* Hide the actual ugly input */
        .file-upload-wrapper input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 100%;
            opacity: 0;
            cursor: pointer;
        }

        /* --- BUTTON STYLES --- */
        .btn-custom {
            background: linear-gradient(45deg, #43A047, #66BB6A);
            border: none;
            padding: 12px 40px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 16px;
            color: white;
            box-shadow: 0 4px 15px rgba(67, 160, 71, 0.4);
            transition: transform 0.2s;
            width: 100%;
        }

        .btn-custom:hover {
            transform: translateY(-2px);
            background: linear-gradient(45deg, #2E7D32, #43A047);
            color: white;
        }

        /* --- RESULT SECTION --- */
        .result-container {
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            color: #333;
            text-align: left;
            animation: fadeIn 0.5s ease-in-out;
        }

        .result-img-container img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 2px solid #ddd;
        }

        .result-text h3 {
            color: #2E7D32; /* Green for disease name */
            font-weight: 700;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .result-text p {
            font-size: 14px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .label-bold {
            font-weight: 600;
            color: #333;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- HEADLINE --- */
        .main-headline {
            position: relative;
            z-index: 2;
            color: white;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            margin-bottom: -20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid ps-4 pe-4">
            <a class="navbar-brand" href="#" style="display: flex; align-items: center; text-decoration: none;">
                <img src="../static/images/logo1 (1).png" alt="" width="50" height="40" class="d-inline-block align-text-top" style="margin-right: 10px;">
                <span style="font-family: 'Poppins', sans-serif; color: #fff; font-size: 30px; font-weight: 700; letter-spacing: -0.5px; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">Plant</span>
                <span style="font-family: 'Poppins', sans-serif; color: #AED581; font-size: 30px; font-weight: 700; letter-spacing: -0.5px; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">Eye</span>
            </a>
        </div>
    </nav>

    <div class="hero-section">
        <div class="hero-overlay"></div>

        <h1 class="display-4 main-headline">Plant Disease Recognition</h1>

        <div class="glass-card">
            <h1>Upload Leaf Image</h1>
            
            <form action="/upload/" method="POST" enctype="multipart/form-data">
                
                <div class="file-upload-wrapper">
                    <input type="file" name="img" accept="image/png, image/jpeg" required onchange="updateFileName(this)">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <p>Drag & Drop or Click to Upload</p>
                    <p id="file-name" style="font-size: 12px; color: #AED581; margin-top: 5px; font-weight: bold;"></p>
                </div>

                <button type="submit" class="btn btn-custom">Analyze Plant</button>
            </form>

            {% if result %}
            <div class="result-container">
                <div class="result-img-container">
                    <img src="{{imagepath}}" alt="uploaded image">
                </div>
                <div class="result-text">
                    <h3>{{prediction['name']}}</h3>
                    <p><span class="label-bold">Cause:</span> {{prediction['cause']}}</p>
                    <p><span class="label-bold">Solution:</span> {{prediction['cure']}}</p>
                </div>
            </div>
            {% endif %}
            
        </div>
    </div>

    <script src="../static/js/bootstrap.bundle.min.js"></script>
    <script>
        // Simple script to show the file name after selection
        function updateFileName(input) {
            var fileName = input.files[0].name;
            document.getElementById('file-name').innerText = "Selected: " + fileName;
        }
    </script>
</body>
</html>
